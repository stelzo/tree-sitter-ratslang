[package]
name = "tree-sitter-ratslang"
description = "Tree-sitter grammar for the Ratslang configuration language"
version = "0.2.0"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/tree-sitter-ratslang"
keywords = ["incremental", "parsing", "tree-sitter", "ratslang"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/stelzo/tree-sitter-ratslang"
edition = "2021"
rust-version = "1.90"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "/grammar.js",
  "queries/*",
  "src/**",
  "tests/*.rs",
  "test/*.rl",
  "/CHANGELOG.md",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.10.0"

[dev-dependencies]
tree-sitter = "0.27.1"
